<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리넥츠 시즌 관제탑</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{--bg:#F3F2ED;--ink:#1A1A18;--mute:#5C5B55;--line:#E3E1D8;--card:#fff;--navy:#1E2A4A;--soft:#E4E7F2;--warm:#FCEBDD;--warm-b:#B4532A;--warm-t:#6B2E10;--ok:#E0F0E6;--ok-t:#1D4A2E;--bad:#FBE0DD;--bad-t:#8E1F18;--amber:#FFF0D6;--amber-t:#7A4A00}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans KR',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
a{color:var(--navy)}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:16px;background:var(--navy);color:#fff;padding:0 24px;min-height:56px;position:sticky;top:0;z-index:10}
.top a{color:#fff;text-decoration:none}
.brand{font-weight:700;font-size:17px;margin-right:8px}
.topnav{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.topnav a{padding:10px 14px;border-radius:8px;font-size:14px;min-height:44px;display:flex;align-items:center}
.topnav a:hover,.topnav a.on{background:rgba(255,255,255,.16)}
.topright{display:flex;align-items:center;gap:12px;font-size:13px}
.seasonsel{display:flex;align-items:center;gap:8px}
select,input[type=search],input[type=text]{font:inherit;font-size:14px;min-height:40px;padding:0 12px;border:1px solid #CFCCC0;border-radius:8px;background:#fff;color:var(--ink)}
.who{opacity:.85}
.wrap{max-width:1440px;margin:0 auto;padding:28px 32px 80px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--mute)}
h1{margin:4px 0 0;font-size:30px;font-weight:700}
h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--mute);font-size:13px;margin-top:4px}
.crumb{font-size:13px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px}
.btn{font:inherit;font-size:13px;font-weight:500;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid #CFCCC0;background:#fff;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn:hover{filter:brightness(.97)}
.seg{display:inline-flex;background:#fff;border:1px solid #CFCCC0;border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.segb{font:inherit;font-size:13px;min-height:36px;padding:0 16px;border:0;border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
.segb.on{background:var(--navy);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.stats{display:flex;flex-wrap:wrap;gap:16px;margin:20px 0}
.stat{flex:1 1 180px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 20px}
.stat .l{font-size:13px;color:var(--mute)}.stat .v{font-size:32px;font-weight:500;line-height:1.2;margin-top:4px}
.chip{font-size:11px;font-weight:700;border-radius:4px;padding:2px 8px;background:var(--soft);color:#2B3558;display:inline-block}
.chip.warn{background:var(--warm);color:var(--warm-t)}.chip.ok{background:var(--ok);color:var(--ok-t)}.chip.bad{background:var(--bad);color:var(--bad-t)}.chip.amber{background:var(--amber);color:var(--amber-t)}.chip.gray{background:#E9E8E0;color:#4A4A45}
.cc{font-size:11px;font-weight:700;border-radius:4px;padding:2px 8px;border:1px solid rgba(0,0,0,.12);display:inline-block;margin:0 4px 4px 0}
/* board */
.grid{display:grid;grid-template-columns:104px repeat(7,minmax(150px,1fr));gap:8px;margin-bottom:8px;min-width:1200px}
.sh{background:var(--navy);color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;min-height:44px}
.rl{background:#DCDFEA;color:var(--navy);border-radius:10px;padding:14px 12px;display:flex;flex-direction:column;justify-content:space-between;min-height:120px}
.rl b{font-size:15px}.rl span{font-size:12px;color:#44507A}
.col{background:#E9E8E0;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.dash{color:#6B6A62;text-align:center;padding-top:8px}
.kcard{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid #DAD8CD;border-radius:10px;padding:12px;text-decoration:none;color:inherit}
.kcard:hover{border-color:var(--navy);box-shadow:0 0 0 2px rgba(30,42,74,.15)}
.kcard{cursor:pointer;position:relative}
.kcard .kstat,.kcard .kflag,.kcard .kmore{display:none}
.kcard.open .kstat,.kcard.open .kflag{display:block}
.kcard.open .kmore{display:block;font-size:12px;font-weight:700;text-align:right;text-decoration:none}
.kcard:not(.open)::after{content:'▾';position:absolute;right:10px;bottom:8px;font-size:10px;color:var(--mute)}
.kcard.open{border-color:var(--navy)}
.kcard .kn{font-size:13px;font-weight:500;line-height:1.35}
.kstat{border:1.5px solid var(--warm-b);background:var(--warm);border-radius:8px;padding:8px 10px;color:var(--warm-t);font-size:12px;line-height:1.4}
.kflag{font-size:11px;color:#8A3A12;background:#FFF3E8;border-radius:6px;padding:4px 8px}
.hold{display:flex;flex-wrap:wrap;gap:10px;background:#E3E4EC;border-radius:10px;padding:10px;margin-top:12px}
.hitem{background:#fff;border:1px solid #DAD8CD;border-radius:8px;padding:10px 14px;display:flex;gap:10px;align-items:center}
.scroll{overflow-x:auto}
/* menu */
.menu details{border-bottom:1px solid #D8D6CC}
.menu summary{list-style:none;cursor:pointer;padding:14px 4px;font-size:18px;font-weight:500;display:flex;justify-content:space-between;min-height:48px;align-items:center}
.menu summary::-webkit-details-marker{display:none}
.menu summary::after{content:"▾";color:var(--mute)}
.menu details[open]>summary::after{content:"▴"}
.menu .l1>summary{font-size:22px;font-weight:700}
.menu .inner{padding-left:28px}
.menu a.item{display:flex;justify-content:space-between;padding:12px 4px;min-height:44px;text-decoration:none;color:var(--ink);border-bottom:1px solid #ECEAE2}
.menu a.item:hover{background:#EAE9E1}
.menu .arr{color:var(--mute);font-size:13px}
/* detail */
.steps{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}
.step{flex:1 1 130px;border-radius:10px;padding:12px 16px;background:var(--navy);color:#fff;min-height:64px}
.step.cur{background:#fff;color:var(--navy);border:2px solid var(--navy)}.step.todo{background:#E9E8E0;color:var(--mute)}
.step .sn{font-size:11px;opacity:.8}.step .st{font-weight:700;font-size:14px}.step .sd{font-size:11px;opacity:.85}
.two{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.photo{flex:0 0 300px;height:300px;border-radius:12px;background:#EFEDE4;border:1px dashed #CFCCC0;display:flex;align-items:center;justify-content:center;color:var(--mute);text-align:center;overflow:hidden;padding:12px;font-size:13px}
.photo img{width:100%;height:100%;object-fit:contain}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid #F0EEE6;font-size:13px}
.kv span:first-child{color:var(--mute)}
.info{flex:1 1 480px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));column-gap:28px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#F6F5F0;font-size:12px;font-weight:700;color:var(--mute);text-align:left;padding:10px 12px;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #F0EEE6;vertical-align:middle}
th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
td.n,th.n{text-align:right}
tr.latest td{background:var(--warm)}
tr.sub td{background:#FAF9F5}
tr.tot td{background:#F6F5F0;font-weight:700}
.dl{display:block;font-size:11px;font-weight:700;border-radius:4px;padding:0 6px;margin-top:2px;width:max-content;margin-left:auto}
.dl.neg{background:var(--bad);color:var(--bad-t)}.dl.pos{background:var(--amber);color:var(--amber-t)}.dl.eq{background:#E9E8E0;color:#4A4A45}.dl.wait{background:transparent;color:#6B6A62;font-weight:500}
button.tgl{font:inherit;font-weight:700;background:none;border:0;color:var(--navy);cursor:pointer;min-height:36px;padding:0;display:flex;gap:8px;align-items:center}
.empty{color:var(--mute);padding:24px 4px}
.note{font-size:12px;color:var(--mute);margin:8px 0 0}
.locked{background:#EFEDE4;border:1px dashed #CFCCC0;border-radius:8px;padding:10px 14px;color:var(--mute);font-size:13px}
#banner .b{background:#FFF3D6;color:#6B4A00;padding:8px 24px;font-size:13px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.login{max-width:520px;margin:100px auto;text-align:center}
.top .btn{min-height:34px;padding:0 14px}.top .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
#refresh[disabled]{opacity:.7;cursor:progress}
.login input{font:inherit;font-size:16px;min-height:44px;padding:0 14px;border:1px solid #CFCCC0;border-radius:8px;width:220px;text-align:center}
.login .err{color:#A3341F;font-size:13px;min-height:20px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F2A44;color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.show{opacity:1}#toast.bad{background:#A3341F}
.pk{border:1.5px solid var(--ink);background:#fff;margin-bottom:12px}
.pk .hd{padding:10px 14px;font-weight:700;border-bottom:1px solid #D8D6CC}
.files .f{border:1px solid var(--line);background:#fff;border-radius:12px;margin-bottom:12px}
.files .fh{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px}
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px;padding:4px 16px 16px}
.code{font-size:13px;background:#F6F5F0;border:1px solid var(--line);border-radius:6px;padding:8px 12px;text-align:center}
@media (max-width:720px){.wrap{padding:20px 16px 60px}.top{padding:8px 16px}.photo{flex-basis:100%}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="#/">리넥츠 시즌 관제탑</a>
  <nav class="topnav" aria-label="주 메뉴">
    <a href="#/board">진행 현황</a>
    <a href="#/items">아이템별</a>
    <a href="#/inbound">3PL 검수</a>
    <a href="#/barcode">바코드</a>
    <a href="#/archive">패킹리스트 보관함</a>
  </nav>
  <div class="topright">
    <label class="seasonsel">시즌
      <select id="season" aria-label="시즌 선택"></select>
    </label>
    <span id="who" class="who"></span>
    <span id="upd" class="who"></span>
    <button id="refresh" class="btn" type="button" hidden>최신화</button>
    <button id="lockbtn" class="btn ghost" type="button" hidden>잠그기</button>
  </div>
</header>
<div id="banner"></div>
<main id="app" class="wrap"></main>
<script>/* config.js 는 사이트 첫 폴더에 있다 (…/27SS 주소에서도) */window.SITE_ROOT=location.pathname.replace(/\/+$/,'').replace(/\/\d{2}(SS|FW)$/i,'')+'/';if(!/\/$/.test(window.SITE_ROOT))window.SITE_ROOT+='/';document.write('<script src="'+window.SITE_ROOT+'config.js"><\/script>');</script>
<script>/* 관제탑 서버(Apps Script) 연결: 비밀번호 → 데이터 받기 → 데모 화면이 쓰는 표 형식으로 바꾸기 · [최신화] */
(function () {
  'use strict';
  var API = (window.SITE_CONFIG && window.SITE_CONFIG.api) || '';
  if (!API) return; // 서버 주소가 없으면 예전 데모처럼 동작
  var PW = 'renacts.pw';
  var DATA = null;
  var seg = location.pathname.replace(/\/+$/, '').split('/').pop() || '';
  var qs = new URLSearchParams(location.search).get('s') || '';
  var SEASON = (/^\d{2}(SS|FW)$/i.test(seg) ? seg : /^\d{2}(SS|FW)$/i.test(qs) ? qs : '').toUpperCase();
  if (SEASON) document.title = '리넥츠 ' + SEASON + ' 관제탑';

  function $(s) { return document.querySelector(s); }
  function sget(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function sset(k, v) { try { localStorage.setItem(k, v); } catch (e) { } }
  function sdel(k) { try { localStorage.removeItem(k); } catch (e) { } }
  function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function api(action, pw) {
    return fetch(API, { method: 'POST', body: JSON.stringify({ action: action, pw: pw }), redirect: 'follow' })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok) { var e = new Error(j.error || '서버 오류'); e.auth = /비밀번호/.test(j.error || ''); throw e; } return j.data; });
  }
  function toast(msg, bad) {
    var t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
    t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
    clearTimeout(t._h); t._h = setTimeout(function () { t.className = ''; }, 5000);
  }
  function use(data) {
    DATA = data;
    $('#upd').textContent = '최신화 ' + (data.updated || '');
    $('#refresh').hidden = false; $('#lockbtn').hidden = false;
  }

  /* 비밀번호 화면 */
  function lockForm(msg) {
    return new Promise(function (resolve) {
      $('#app').innerHTML = '<form class="login card" id="lockf"><h1>리넥츠 시즌 관제탑</h1><p class="sub">팀 공용 비밀번호를 입력하세요.</p>' +
        '<p><input type="password" id="pw" autocomplete="current-password" aria-label="비밀번호" required></p>' +
        '<p class="err" id="err" role="alert">' + esc(msg || '') + '</p><p><button class="btn pri" type="submit">열기</button></p></form>';
      $('#pw').focus();
      $('#lockf').onsubmit = function (ev) {
        ev.preventDefault();
        var pw = $('#pw').value; $('#err').textContent = '확인 중…';
        api('get', pw).then(function (data) { sset(PW, pw); use(data); resolve(data); })
          .catch(function (e) { $('#err').textContent = e.message; });
      };
    });
  }

  function labels() { return (DATA.seasons || []).map(function (s) { return s.label; }); }

  /* ---------- 서버 데이터 → 데모 표 형식 ---------- */
  function strip(st) { return String(st || '').replace(/^\d{1,2}_?\s*/, ''); }
  var CATS = ['아우터(코트,점퍼,패딩)', '자켓(블레이저,자켓,셔켓)', '셔츠(솔리드,체크)', '니트(긴팔,반팔)', '다이마루상의(맨투맨,긴팔,반팔)', '팬츠(데님,우븐)', '하프팬츠(데님,우븐)', '악세사리(타이,벨트,모자)'];
  var STG = ['개발진행중', '패턴', '프로토샘플', 'QC · 재QC', 'APP', '메인수납', '종결'];
  var QK = ['order', 'cut', 'wash', 'finish', 'store', 'tpl'];
  function raw(label) {
    var season = (DATA.seasons || []).filter(function (s) { return s.label === label; })[0] || { items: [] };
    var T = {};
    T['10_제품마스터'] = [['생산건ID', '품번', '차수', '시즌', '구분', '기획명', 'Flow FIX 제품명', '영문 판매명', '카테고리', '상태', '현재 단계', '최근 일자', '최근 내용', '기록 수', '컬러', '혼용율', '원산지(제조국)', '워싱 여부', '세트 연결', '봉제공장', 'FIT', '원단', '규격 · 중량', '워싱기법', '원가 NET TOTAL (VAT+)', '판가', '배수', '원가계산서 링크', '작업지시서 PDF 링크', '원부자재 발주 링크', '메모', '제품 시트']];
    T['11_컬러'] = [['생산건ID', '컬러', '작업지시서 컬러코드', '패킹리스트·바코드 컬러코드', '비고', '컬러 순번', '조회 키', '컬러 누적 목록']];
    T['12_히스토리'] = [['생산건ID', '일자', '단계', '내용', '출처', '첨부 링크', '순번', '최신', '최신 키', '단계 키', '순번 키', '제품명', '작성자']];
    T['13_작업지시서'] = [['생산건ID', '컬러', '사이즈 1', '사이즈 2', '사이즈 3', '사이즈 4', '합계', '비고', '조회 키']];
    T['14_사이즈치수'] = [['생산건ID', '부위', '사이즈 1', '사이즈 2', '사이즈 3', '사이즈 4', '비고', '부위 순번', '조회 키']];
    T['15_이동수량'] = [['생산건ID', '컬러', '사이즈', '요청수량', '재단', '워싱처 입고', '완성집 입고', '수납용 입고', '3PL 입고', '워싱 여부', '재단 증감', '워싱처 증감', '완성집 증감', '수납용 증감', '3PL 증감', '부족 · 초과 요약', '증빙 링크', '입력일', '메모']];
    T['20_3PL검수'] = [['입고일', '스타일 NO (생산건ID)', '바코드', '입고수량 (패킹리스트)', '검수수량 (3PL)', '상품명', '컬러', '사이즈', '차이 (검수−입고)', '전장 대조', '상태', '검수파일 링크', '메모']];

  var q = S.q.trim().toLowerCase();

  var rows = all.filter(function (r) { return !q || String(r['바코드 번호']).toLowerCase().indexOf(q) >= 0 || String(r['스타일 NO (생산건ID)']).toLowerCase().indexOf(q) >= 0; });
  var oc = S.data.barcodes.filter(function (r) { return r['구분'] === '기존'; }).length, nc = S.data.barcodes.length - oc;
  var h = title('바코드 시스템 마스터', '바코드 시스템 마스터', '기존 데이터는 보관용이고, 시즌 중 새로 부여한 바코드는 신규로 쌓입니다.');
  h += '<div class="seg" style="margin-bottom:16px"><button class="segb ' + (S.bcTab === 'old' ? 'on' : '') + '" data-bc="old">기존 데이터 · ' + oc + '건</button><button class="segb ' + (S.bcTab === 'new' ? 'on' : '') + '" data-bc="new">신규 데이터 · ' + nc + '건</button></div>';
  h += '<div class="card"><div class="row" style="margin-bottom:12px"><h2 style="margin:0">' + (S.bcTab === 'old' ? '기존 바코드' : '신규 바코드') + '</h2><input type="search" id="q" placeholder="바코드 또는 스타일 NO" value="' + esc(S.q) + '" aria-label="검색"></div>' +
    (rows.length ? '<div class="scroll"><table><thead><tr><th>스타일 NO</th><th>바코드</th><th>컬러</th><th class="n">사이즈</th><th>등록일</th></tr></thead><tbody>' + rows.map(function (r) { return '<tr><td class="mono">' + esc(r['스타일 NO (생산건ID)']) + '</td><td class="mono">' + esc(r['바코드 번호']) + '</td><td>' + esc(r['컬러']) + '</td><td class="n mono">' + esc(r['사이즈']) + '</td><td class="mono">' + esc(r['등록일']) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">' + (q ? '검색 결과가 없어요.' : '아직 등록된 바코드가 없어요.') + '</div>') + '</div>';
  return h;
}
function viewArchive() {
  var q = S.q.trim().toLowerCase(), d = S.data;
  var files = d.archive.filter(function (f) {
    if (!q) return true;
    if (String(f['파일명']).toLowerCase().indexOf(q) >= 0) return true;
    return d.barcodes.some(function (b) { return b['스타일 NO (생산건ID)'] === f['생산건ID'] && b['컬러'] === f['컬러'] && String(b['바코드 번호']).indexOf(q) >= 0; });
  });
  var h = title('패킹리스트 데이터', '패킹리스트 엑셀 보관함', '내보낸 패킹리스트 파일을 모아 둡니다. 파일을 펼치면 바코드 번호만 보여요.', '<input type="search" id="q" placeholder="파일명 또는 바코드 번호" value="' + esc(S.q) + '" aria-label="검색">');
  h += '<div class="files">' + (files.length ? files.map(function (f) {
    var codes = d.barcodes.filter(function (b) { return b['스타일 NO (생산건ID)'] === f['생산건ID'] && b['컬러'] === f['컬러']; });
    var open = S.openFile === f['파일명'] || (q && codes.some(function (b) { return String(b['바코드 번호']).indexOf(q) >= 0; }));
    return '<div class="f"><div class="fh"><button class="tgl" data-file="' + esc(f['파일명']) + '" aria-expanded="' + !!open + '"><span class="chip ok">XLS</span> <span class="mono">' + esc(f['파일명']) + '</span> <span class="sub">입고일 ' + esc(f['입고일']) + ' · 바코드 ' + codes.length + '개</span> ' + (open ? '▴' : '▾') + '</button>' +
      (f['파일 링크 (드라이브)'] ? '<a class="btn" target="_blank" rel="noopener" href="' + esc(f['파일 링크 (드라이브)']) + '">엑셀 열기</a>' : '<span class="chip gray">파일 링크 미등록</span>') + '</div>' +
      (open ? '<div class="codes">' + codes.map(function (b) { return '<span class="code mono">' + esc(b['바코드 번호']) + '</span>'; }).join('') + '</div>' : '') + '</div>'; }).join('') : '<div class="card empty">검색 결과가 없어요.</div>') + '</div>';
  return h;
}

/* ---------- 라우터 ---------- */
function render() {
  if (!S.data) return;
  var hash = location.hash || '#/', app = $('#app'), html;
  var m = /^#\/p\/(.+)$/.exec(hash);
  if (m) html = viewProduct(decodeURIComponent(m[1]));
  else if (hash === '#/board') html = viewBoard();
  else if (hash === '#/inbound') html = viewInbound();
  else if (hash === '#/barcode') html = viewBarcode();
  else if (hash === '#/archive') html = viewArchive();
  else html = viewHome();
  app.innerHTML = html;
  Array.prototype.forEach.call(document.querySelectorAll('.topnav a'), function (a) { a.classList.toggle('on', a.getAttribute('href') === hash || (a.getAttribute('href') === '#/items' && hash === '#/')); });
  var q = $('#q'); if (q) q.addEventListener('input', function () { S.q = q.value; var pos = q.selectionStart; render(); var q2 = $('#q'); q2.focus(); q2.setSelectionRange(pos, pos); });
}
function banner() {
  var b = $('#banner');
  if (!DEMO || window.RENACTS) { b.innerHTML = ''; return; }
  b.innerHTML = '<div class="b"><b>27SS 확인용</b><span>0_사이트 데이터_27SS 폴더의 제품 파일 3개에서 끌어온 화면입니다 (R26FJK06, R27SJK01, R27SJK02). 원가는 넣지 않았어요.</span></div>';
  if ($('#demoCost')) $('#demoCost').onchange = function () { S.demoCost = this.checked; S.hasCost = S.demoCost; render(); };
}
document.addEventListener('keydown', function (e) { var c = e.target.closest && e.target.closest('[data-card]'); if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); c.click(); } });
document.addEventListener('click', function (e) {
  if (e.target.closest('.kmore')) return;
  var c = e.target.closest('[data-card]');
  if (c) { var k = c.dataset.card; S.openCards[k] = !S.openCards[k]; c.classList.toggle('open', S.openCards[k]); c.setAttribute('aria-expanded', S.openCards[k]); return; }
  var t = e.target.closest('[data-filter],[data-inb],[data-bc],[data-color],[data-file]'); if (!t) return;
  if (t.dataset.filter) S.filter = t.dataset.filter;
  else if (t.dataset.inb) S.inboundFilter = t.dataset.inb;
  else if (t.dataset.bc) { S.bcTab = t.dataset.bc; S.q = ''; }
  else if (t.dataset.color) S.openColors[t.dataset.color] = !S.openColors[t.dataset.color];
  else if (t.dataset.file) S.openFile = S.openFile === t.dataset.file ? null : t.dataset.file;
  render();
});
window.addEventListener('hashchange', function () { S.q = ''; render(); window.scrollTo(0, 0); });
var sel = $('#season');
sel.innerHTML = SEASONS.map(function (s) { return '<option>' + esc(s.label) + '</option>'; }).join('');
sel.onchange = function () { S.season = sel.value; if (window.RENACTS) { location.href = window.SITE_ROOT + sel.value + location.hash; return; } load(); };
banner();
ensureLogin().then(load);
})();
</script>
</body>
</html>
